<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Weather App</title>
</head>
<body>
    <h1>Weather App</h1>
    <div class="container">
        <!-- Responsive Container -->
        <div class="input-container">
                <input type="text" id="city-input" placeholder="City........">
                <button id="get-weather-btn">Search</button>
        </div>
        <div class="temp-btn-container">
            <button id="celsius-btn" class="temp-btn active-unit">°C</button>
            <button id="fahrenheit-btn" class="temp-btn">°F</button>
        </div>
        
        <!-- Loding Spinner -->
        <div id="loading-spinner" class="spinner hidden"></div>

        <!-- Error Message -->
        <p id="error-message" class="hidden">City not found or API request failed. Please try again.</p>

        <!-- Fetched Data Container -->
        <div id="weather-info">
            <h2 id="city-name"></h2>
            <p id="temprature"></p>
            <p id="description"></p>
            <p id="speed"></p>
            <p id="humidity"></p>

            <!-- 3-Day Forecasting -->
            <h3 class="forecast-heading">3-Day Forecast</h3>
            <div id="forecast-container" class="forecast-container"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
