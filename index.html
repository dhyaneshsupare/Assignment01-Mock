<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Weather App</title>
</head>
<body>
    <h1>Weather App</h1>
    <div class="container">
        <!-- Responsive Container -->
        <div class="input-container">
                <input type="text" id="city-input" placeholder="City........">
                <button id="get-weather-btn">Search</button>
        </div>
        <div class="temp-btn-container">
            <button class="temp-btn">°C</button>
            <button class="temp-btn">°F</button>
        </div>

        <!-- Fetched Data Container -->
        <div id="weather-info">
            <h2 id="city-name"></h2>
            <p id="temprature"></p>
            <p id="description"></p>
            <p id="speed"></p>
            <p id="humidity"></p>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
